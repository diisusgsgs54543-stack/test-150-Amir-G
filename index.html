<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C# тест — 150 сұрақ</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dfe3ee;--ac:#3b5bdb;--ok:#2b9348;--okbg:#e6f6ec;--no:#d00000;--nobg:#fdeaea}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1d212c;--tx:#e8ebf3;--mut:#98a1b5;--bd:#2d3342;--ac:#7c93ff;--ok:#4cc16f;--okbg:#17301f;--no:#ff6b6b;--nobg:#3a1c1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>div{height:100%;background:var(--ac);width:0;transition:width .2s}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.q{font-weight:600;margin:0 0 10px;white-space:pre-wrap}
pre{background:#0f1320;color:#e6e9f5;padding:12px;border-radius:10px;overflow:auto;font:14px/1.45 ui-monospace,Consolas,monospace;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}
button.b.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.b:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.grid button{padding:6px 0;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:13px inherit}
.grid button.cur{outline:2px solid var(--ac)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.no{background:var(--nobg);border-color:var(--no)}
.res{text-align:center}
.res .big{font-size:40px;font-weight:700}
.hide{display:none}
label.sw{font-size:14px;color:var(--mut);display:inline-flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>C# / ООП тест — 150 сұрақ</h1>
  <div class="card" id="quiz">
    <div class="top"><span id="pos"></span><span id="score"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <div style="height:14px"></div>
    <p class="q" id="qt"></p>
    <pre id="qc" class="hide"></pre>
    <div id="opts"></div>
    <div class="row">
      <button class="b sec" id="prev">← Алдыңғы</button>
      <button class="b" id="next">Келесі →</button>
      <button class="b sec" id="finish">Аяқтау</button>
    </div>
  </div>
  <div class="card hide" id="result"></div>
  <div class="card">
    <div class="top"><span>Сұрақтар</span>
      <span>
        <label class="sw"><input type="checkbox" id="shuf"> Сұрақтарды араластыру</label>
        <button class="b sec" id="restart" style="padding:4px 10px;margin-left:8px">Қайта бастау</button>
      </span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script type="text/plain" id="data">
#1
Объектіге бағытталған бағдарламалау парадигмасының негізгі тұжырымдамасы қандай?
A) Тек функцияларды пайдалану
B) Бағдарламаны объектілер мен кластар негізінде құру
C) Тек айнымалылармен жұмыс істеу
D) Кодты тек бір файлда жазу
=B
#2
Әдісті шақырған кезде C# тіліндегі берілген код нені шығарады?
class Person
{
    public string Name = "Alex";
}
Person p = new Person();
Console.Write(p.Name);
A) Person
B) Name
C) Alex
D) Қате
=C
#3
Қандай қол жеткізу модификаторы класс элементін ТЕК осы класстың ішінде қолжетімді етеді?
A) public
B) protected
C) internal
D) private
=D
#4
C# тіліндегі класс конструкторы қандай рөл атқарады?
A) Объектіні жою
B) Объектіні құру және бастапқы мәндерін орнату
C) Класты мұрагерлікке алу
D) Әдістерді өшіру
=B
#5
C# тіліндегі келесі код үзіндісі нені шығарады?
class Car
{
    public int Speed;
    public Car(int speed)
    {
        Speed = speed;
    }
}
Car c = new Car(100);
Console.Write(c.Speed);
A) 0
B) 100
C) speed
D) Қате
=B
#6
Объектіге бағытталған бағдарламалауда (ООП) инкапсуляция деп нені түсінеді?
A) Бір кластан бірнеше класс құру
B) Деректер мен әдістерді біріктіріп, деректерге қолжетімділікті шектеу
C) Бір әдісті бірнеше рет шақыру
D) Объектілерді жою
=B
#7
C# тіліндегі қандай қол жеткізу модификаторы класс мүшесіне ағымдағы жинақ (.dll/.exe) шегінде қолжетімділікке рұқсат береді?
A) private
B) protected
C) internal
D) public
=C
#8
Жеке (private) айнымалыға қол жеткізуге тырысқанда бұл код нені шығарады?
class Account
{
    private int balance = 500;
}
Account acc = new Account();
Console.Write(acc.balance);
A) 500
B) 0
C) null
D) Компиляция қатесі
=D
#9
C# тілінде автоқасиеттер (Auto-Properties) не үшін қолданылады?
A) Класты автоматты түрде жою үшін
B) Қасиеттерді қысқа түрде жариялау үшін
C) Объектіні көшіру үшін
D) Цикл құру үшін
=B
#10
Логикасы бар қасиетті қолданатын C# код үзіндісі нені шығарады?
class User
{
    private int _age;
    public int Age
    {
        get => _age;
        set => _age = value < 0 ? 0 : value;
    }
}
User u = new User();
u.Age = -15;
Console.Write(u.Age);
A) -15
B) 15
C) 0
D) Қате
=C
#11
C# тілінде бір класты екіншісінен мұрагерлікке алу үшін қандай кілт сөз қолданылады?
A) implements
B) extends
C) base
D) : (қос нүкте)
=D
#12
Мұраланған әдісті шақырған кезде бұл код нені шығарады?
class Animal
{
    public void Eat() => Console.Write("Food");
}
class Dog : Animal { }Dog d = new Dog();
d.Eat();
A) Dog
B) Animal
C) Food
D) Қате
=C
#13
C# тілінде негізгі класста еншілес класқа әдісті қайта анықтауға рұқсат беру үшін қандай кілт сөз қолданылады?
A) override
B) virtual
C) sealed
D) static
=B
#14
C# тілінде негізгі класстың виртуалды әдісін қайта анықтау үшін еншілес класста қандай кілт сөз қолданылады?
A) virtual
B) new
C) override
D) base
=C
#15
Полиморфизмі бар келесі код үзіндісі нені шығарады?
class Printer
{
    public virtual void Print() => Console.Write("Base");
}
class ColorPrinter : Printer
{
    public override void Print() => Console.Write("Color");
}
Printer p = new ColorPrinter();
p.Print();
A) Base
B) Color
C) Printer
D) Қате
=B
#16
Негізгі класқа base кілт сөзі арқылы қол жеткізген кезде бұл код нені шығарады?
class Parent
{
    public virtual void Greet() => Console.Write("Hi");
}
class Child : Parent
{
    public override void Greet()
    {
        base.Greet();
        Console.Write("!");
    }
}
Child c = new Child();
c.Greet();
A) Hi
B) !
C) Hi!
D) Қате
=C
#17
C# тілінде қандай кілт сөз осы класстан әрі қарай мұрагерлікке алуға тыйым салады?
A) static
B) virtual
C) abstract
D) sealed
=D
#18
sealed модификаторы бар класстан мұрагерлікке алуға тырысқанда қандай қате орын алады?
sealed class FinalClass { }class SubClass : FinalClass { }
A) Орындау қатесі
B) Компиляция қатесі
C) Ескерту ғана шығады
D) Қате болмайды
=B
#19
C# тіліндегі абстрактілі класс дегеніміз не?
A) Тек объектілерді сақтайтын класс
B) Тікелей объектісін жасауға болмайтын және мұрагерлікке арналған класс
C) Тек статикалық әдістерден тұратын класс
D) Жойылған класс
=B
#20
Абстрактілі класы бар келесі код үзіндісі нені шығарады?
abstract class Appliance
{
    public abstract void TurnOn();
}
class Lamp : Appliance
{
    public override void TurnOn() => Console.Write("Light");
}
Appliance a = new Lamp();
a.TurnOn();
A) Appliance
B) TurnOn
C) Light
D) Қате
=C
#21
C# тіліндегі интерфейс (interface) дегеніміз не?
A) Объектіні жою әдісі
B) Класс орындауы тиіс мүшелердің келісімшартын анықтайтын құрылым
C) Деректер базасы
D) Айнымалының түрі
=B
#22
C# тілінде класс интерфейсті іске асыру үшін қандай кілт сөз қолданылады?
A) implements
B) interface
C) : (қос нүкте)
D) extends
=C
#23
C# тілінде бір класс бір мезгілде қанша интерфейсті іске асыра алады?
A) Тек біреуін
B) Екеуін ғана
C) Үшеуін ғана
D) Қажет болғанша бірнешеуін
=D
#24
C# тілінде интерфейсті анық (explicit) іске асырған кезде код нені шығарады?
interface IRunner
{
    void Run();
}
class Athlete : IRunner
{
    void IRunner.Run() => Console.Write("Running");
}
IRunner r = new Athlete();
r.Run();
A) Athlete
B) Run
C) Running
D) Қате
=C
#25
C# тіліндегі қандай кілт сөз объект жасамай-ақ қолжетімді статикалық әдіс немесе класс жасауға мүмкіндік береді?
A) virtual
B) static
C) private
D) abstract
=B
#26
Статикалық қасиеті бар келесі код үзіндісі нені шығарады?
class Counter
{
    public static int Count = 0;
    public Counter()
    {
        Count++;
    }
}
new Counter();
new Counter();
Console.Write(Counter.Count);
A) 0
B) 1
C) 2
D) Қате
=C
#27
C# тіліндегі мәндік тип (struct) пен сілтемелік тип (class) арасындағы басты айырмашылық неде?
A) Екеуі де тек сілтеме арқылы беріледі
B) Struct — мәндік тип, ал class — сілтемелік тип
C) Class тек сандарды сақтайды
D) Struct мұрагерлікке арналған
=B
#28
Құрылымды әдіске бергенде келесі код үзіндісі нені шығарады?
struct Point
{
    public int X;
}
static void Change(Point p)
{
    p.X = 100;
}
Point pt = new Point { X = 10 };
Change(pt);
Console.Write(pt.X);
A) 100
B) 10
C) 0
D) Қате
=B
#29
КЛАССТЫ әдіске бергенде ұқсас код үзіндісі нені шығарады?
class PointClass
{
    public int X;
}
static void Change(PointClass p)
{
    p.X = 100;
}
PointClass pt = new PointClass { X = 10 };
Change(pt);
Console.Write(pt.X);
A) 10
B) 0
C) 100
D) Қате
=C
#30
C# 9.0+ нұсқасында жазба типтері (record) не үшін қолданылады?
A) Тек цикл құру үшін
B) Деректерді сақтауға және мәндері бойынша салыстыруға ыңғайлы тип құру үшін
C) Файлдарды жою үшін
D) Тек интерфейстерді жасау үшін
=B
#31
Екі жазбаны (record) салыстырған кезде C# кодының бұл үзіндісі нені шығарады?
public record Item(string Name, int Price);
Item i1 = new Item("Pen", 10);
Item i2 = new Item("Pen", 10);
Console.Write(i1 == i2);
A) False
B) True
C) Pen
D) Қате
=B
#32
Қандай кілт сөз параметрді әдіске сілтеме бойынша (by reference) оны өзгерту мүмкіндігімен беруге мүмкіндік береді?
A) out
B) ref
C) static
D) const
=B
#33
ref модификаторын қолданатын бұл код нені шығарады?
static void Modify(ref int n) => n += 5;
int num = 10;
Modify(ref num);
Console.Write(num);
A) 10
B) 5
C) 15
D) 0
=C
#34
C# тіліндегі out модификаторының ref модификаторынан айырмашылығы неде?
A) out параметріне әдіс ішінде міндетті түрде мән берілуі керек
B) out тек сандарға қолданылады
C) ref мәнді қайтармайды
D) Екеуінің айырмашылығы жоқ
=A
#35
this кілт сөзі бар келесі код үзіндісі нені шығарады?
class Box
{
    private int w;
    public Box(int w)
    {
        this.w = w;
    }
    public int GetW() => w;
}
Box b = new Box(42);
Console.Write(b.GetW());
A) 0
B) 42
C) w
D) Қате
=B
#36
C# тілінде деструктор (~ClassName()) шақырылғанда не болады?
A) Объект автоматты түрде құрылады
B) Объектіні жою алдында тазалау әрекеттері орындалады
C) Конструктор шақырылады
D) Класс мұрагерлікке алынады
=B
#37
Класста аты бірдей, бірақ параметрлерінің типтері/саны әртүрлі бірнеше әдіс жарияланса, не болады?
A) Компиляция қатесі болады
B) Әдістердің атауы автоматты өзгереді
C) Әдістерді қайта жүктеу (Overloading) орындалады
D) Класс жойылады
=C
#38
Келесі қайта жүктелген әдіс нені шығарады?
class Calc
{
    public int Add(int a, int b) => a + b;
    public string Add(string a, string b) => a + b;
}
Calc c = new Calc();
Console.Write(c.Add("1", "2"));
A) 3
B) 12
C) 1
D) Қате
=B
#39
Бағдарламалық жасақтаманы жобалауда SOLID аббревиатурасы нені білдіреді?
A) Бағдарламалау тілдерінің атауы
B) Объектіге бағытталған жобалаудың бес негізгі принципі
C) Деректер базасының түрлері
D) Компиляция командалары
=B
#40
Бірыңғай жауапкершілік принципі (Single Responsibility Principle — SRP) неде?
A) Класс тек бір ғана жауапкершілікке ие болуы керек
B) Класс барлық жұмысты орындауы керек
C) Әр класта тек бір әдіс болуы керек
D) Класта тек бір айнымалы болуы керек
=A
#41
Егер класс SRP принципін бұзса (God Object / «Құдайлық объект» болып табылса), қандай мәселе туындайды?
A) Код жылдамдайды
B) Класс тым көп міндет атқарып, оны өзгерту және қолдау қиындайды
C) Бағдарлама көлемі азаяды
D) Қателер толығымен жойылады
=B
#42
Ашықтық/жабықтық принципі (Open/Closed Principle — OCP) неде?
A) Класс өзгертуге ашық, кеңейтуге жабық болуы керек
B) Бағдарлама тек жабық болуы керек
C) Бағдарламаны өзгертуге және кеңейтуге болмайды
D) Класс тек бір рет құрылуы керек
=A
#43
Барбара Лисков алмастыру принципі (Liskov Substitution Principle — LSP) нені растайды?
A) Еншілес класс негізгі кластың орнына қолданылғанда бағдарлама дұрыс жұмыс істеуі керек
B) Әр класта конструктор болуы керек
C) Кластар тек private болуы керек
D) Мұрагерлікке тыйым салынады
=A
#44
Интерфейстерді бөлу принципі (Interface Segregation Principle — ISP) неде?
A) Бір үлкен интерфейс құру керек
B) Кластар қолданбайтын әдістерге тәуелді болмауы керек
C) Барлық әдістер статикалық болуы керек
D) Интерфейстерді қолдануға болмайды
=B
#45
Тәуелділіктерді инверсиялау принципі (Dependency Inversion Principle — DIP) неде?

A) Деректердің жартысын ғана көшіру
B) Барлық операциялар толық орындалуы немесе қате болған жағдайда толығымен кері қайтарылуы керек
C) Қателерді елемеу
D) Деректерді кездейсоқ сақтау
=B
</script>

<script>
(function(){
  var raw = document.getElementById('data').textContent;
  var blocks = raw.split(/\n#\d+\n/).map(function(s){return s.replace(/^\s*#?\d*\n?/,'').replace(/\s+$/,'')}).filter(Boolean);
  // re-split safely
  blocks = raw.replace(/^\s*#1\n/,'').split(/\n#\d+\n/).map(function(s){return s.replace(/\s+$/,'')}).filter(Boolean);
  var ALL = blocks.map(function(b,i){
    var lines = b.split('\n'), opts=[], pre=[], ans=-1;
    lines.forEach(function(l){
      var m = l.match(/^([ABCD])\) (.*)$/);
      if(m){opts.push(m[2]);}
      else if(/^=[ABCD]$/.test(l)){ans='ABCD'.indexOf(l[1]);}
      else pre.push(l);
    });
    return {n:i+1,q:pre[0],code:pre.slice(1).join('\n'),opts:opts,ans:ans};
  });
  var Q=ALL.slice(), cur=0, picked={}; 
  var $=function(id){return document.getElementById(id)};
  function render(){
    var q=Q[cur];
    $('pos').textContent='Сұрақ '+(cur+1)+' / '+Q.length+'  (№'+q.n+')';
    var ok=0,done=0;Q.forEach(function(x,i){if(picked[i]!==undefined){done++;if(picked[i]===x.ans)ok++}});
    $('score').textContent='Дұрыс: '+ok+' / '+done;
    $('prog').style.width=(done/Q.length*100)+'%';
    $('qt').textContent=(cur+1)+'. '+q.q;
    var pc=$('qc'); if(q.code){pc.textContent=q.code;pc.classList.remove('hide')}else pc.classList.add('hide');
    var box=$('opts');box.innerHTML='';
    q.opts.forEach(function(t,i){
      var b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+') '+t;
      if(picked[cur]!==undefined){
        b.disabled=true;
        if(i===q.ans)b.classList.add('ok');
        else if(i===picked[cur])b.classList.add('no');
      }
      b.onclick=function(){picked[cur]=i;render()};
      box.appendChild(b);
    });
    $('prev').disabled=cur===0;
    $('next').disabled=cur===Q.length-1;
    var g=$('grid');g.innerHTML='';
    Q.forEach(function(x,i){
      var b=document.createElement('button');b.textContent=i+1;
      if(i===cur)b.classList.add('cur');
      if(picked[i]!==undefined)b.classList.add(picked[i]===x.ans?'ok':'no');
      b.onclick=function(){cur=i;render();window.scrollTo(0,0)};
      g.appendChild(b);
    });
  }
  function finish(){
    var ok=0,done=0;Q.forEach(function(x,i){if(picked[i]!==undefined){done++;if(picked[i]===x.ans)ok++}});
    var r=$('result');r.classList.remove('hide');
    var pct=Math.round(ok/Q.length*100);
    r.innerHTML='<div class="res"><div class="big">'+ok+' / '+Q.length+' ('+pct+'%)</div><p>Жауап берілді: '+done+' · Қате: '+(done-ok)+' · Жауап берілмеді: '+(Q.length-done)+'</p></div>';
    r.scrollIntoView({behavior:'smooth'});
  }
  function start(){
    Q=ALL.slice();
    if($('shuf').checked){for(var i=Q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=Q[i];Q[i]=Q[j];Q[j]=t}}
    picked={};cur=0;$('result').classList.add('hide');render();window.scrollTo(0,0);
  }
  $('prev').onclick=function(){if(cur>0){cur--;render()}};
  $('next').onclick=function(){if(cur<Q.length-1){cur++;render()}};
  $('finish').onclick=finish;
  $('restart').onclick=start;
  $('shuf').onchange=start;
  render();
})();
</script>
</body>
</html>
